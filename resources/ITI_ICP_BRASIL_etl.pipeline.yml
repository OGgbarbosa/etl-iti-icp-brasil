# The main pipeline for ITI_ICP_BRASIL

resources:
  pipelines:
    ITI_ICP_BRASIL_etl:
      name: ITI_ICP_BRASIL
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/ITI_ICP_BRASIL"

      libraries:
        - glob:
            include: ../src/ITI_ICP_BRASIL/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
