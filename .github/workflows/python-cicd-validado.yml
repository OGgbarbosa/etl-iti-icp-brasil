name: CI/CD Pipeline - ITI ICP Brasil

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Configurar Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Instalar dependências
        run: uv sync --dev

      - name: Executar linter (Ruff)
        run: uv run ruff check .

      - name: Executar testes unitários (Pytest)
        run: uv run pytest

  deploy:
    name: Deploy no Databricks (Produção)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Deploy Databricks Asset Bundle
        run: |
          echo "Testes e linters aprovados com sucesso!"
          echo "Etapa de deploy pronta. Quando configurar os Secrets (DATABRICKS_HOST / DATABRICKS_TOKEN), ativaremos o 'databricks bundle deploy'."