[project]
name = "ITI_ICP_BRASIL"
version = "0.0.1"
authors = [{ name = "gbarbos4@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "ITI_ICP_BRASIL.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821"]
"src/ITI_ICP_BRASIL_etl/transformations/*" = ["F821"]
