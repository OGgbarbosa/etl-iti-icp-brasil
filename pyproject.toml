[project]
name = "ITI_ICP_BRASIL"
version = "0.0.1"
authors = [{ name = "Gabriel Barbosa" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "ITI_ICP_BRASIL.main:main"
run_raw = "ITI_ICP_BRASIL.pipeline:run_raw"
run_bronze = "ITI_ICP_BRASIL.pipeline:run_bronze"
run_silver = "ITI_ICP_BRASIL.pipeline:run_silver"
run_gold = "ITI_ICP_BRASIL.pipeline:run_gold"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["N999", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["src"]

